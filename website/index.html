<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Andromeda Analysis</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/chessboardjs@1.0.0/www/css/chessboard-1.0.0.css"><link rel="stylesheet" href="./styles.css"></head>
<body><div class="app"><header><div class="brand"><span>♞</span><div><b>ANDROMEDA</b><small>CHESS ANALYSIS</small></div></div><div class="modes"><button class="mode active" data-mode="human">Andromeda vs People</button><button class="mode" data-mode="engine">Engine vs Engine</button></div><div class="actions"><button id="flip">↕</button><button id="new">New game</button></div></header>
<main><section class="board-wrap"><div class="player"><span>♟ <b id="blackName">Andromeda</b></span><span id="blackEval">—</span></div><div id="board"></div><div class="player"><span>♙ <b id="whiteName">You</b></span><span id="clock">10:00</span></div></section>
<aside><nav><button class="tab active" data-tab="analysis">Analysis</button><button class="tab" data-tab="moves">Moves</button></nav>
<section id="analysis"><div class="engine"><div><i></i><b id="engineName">Andromeda</b><span id="thinking">Ready</span></div><div class="eval"><strong id="score">0.00</strong><div><em id="evalbar"></em></div></div><p>Depth <b id="depth">0</b> &nbsp; Nodes <b id="nodes">0</b> &nbsp; NPS <b id="nps">0</b></p></div><h5>ENGINE LINES</h5><div id="lines" class="lines">Start a game to see analysis.</div><h5>POSITION</h5><code id="fen">startpos</code></section>
<section id="moves" class="hidden"><h5>GAME MOVES</h5><ol id="moveList"></ol></section>
<footer><button id="undo">← Undo</button><button id="stop">Stop</button><label>Time <select id="time"><option value="3000">3 sec</option><option value="10000" selected>10 sec</option><option value="30000">30 sec</option></select></label><small id="status">Loading…</small></footer></aside></main></div>
<script src="https://cdn.jsdelivr.net/npm/chessboardjs@1.0.0/www/js/chessboard-1.0.0.js"></script><script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script><script type="module" src="./app.js"></script></body></html>
