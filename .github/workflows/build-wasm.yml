name: Build Andromeda WASM

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: andromeda-wasm-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-wasm:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Emscripten
        uses: emscripten-core/setup-emsdk@v15
        with:
          version: latest

      - name: Verify toolchain
        run: |
          em++ --version
          emcc --version

      - name: Build WASM
        run: bash Andromeda/scripts/build-wasm.sh

      - name: Smoke-test generated module
        run: |
          test -s dist/andromeda.js
          test -s dist/andromeda.wasm
          grep -q "AndromedaModule" dist/andromeda.js

      - name: Upload browser engine
        uses: actions/upload-artifact@v5
        with:
          name: andromeda-wasm
          path: |
            dist/andromeda.js
            dist/andromeda.wasm
          if-no-files-found: error
